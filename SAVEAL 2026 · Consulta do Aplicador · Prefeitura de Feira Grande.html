<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAVEAL 2026 · Consulta do Aplicador · Prefeitura de Feira Grande</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4FB; --surface:#FFFFFF; --ink:#10233F; --muted:#5A6B85; --line:#D9E3F0;
  --blue:#1468D8; --navy:#0B2A5B; --yellow:#FCBC02; --green:#3C8F3A; --red:#E5532B;
  --blue-soft:#E6F0FD; --green-soft:#E5F3E4; --red-soft:#FDEBE5; --yellow-soft:#FFF4CC;
  --focus:#1468D8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1628; --surface:#12213A; --ink:#E8EEF8; --muted:#9FB0CA; --line:#243652;
    --blue:#5AA0FF; --blue-soft:#14305A; --green-soft:#17361A; --red-soft:#40201A; --yellow-soft:#3F3410; --focus:#8EBBFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1628; --surface:#12213A; --ink:#E8EEF8; --muted:#9FB0CA; --line:#243652;
  --blue:#5AA0FF; --blue-soft:#14305A; --green-soft:#17361A; --red-soft:#40201A; --yellow-soft:#3F3410; --focus:#8EBBFF;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.band{height:8px;background:linear-gradient(90deg,#1468D8 0 40%,#FCBC02 40% 62%,#3C8F3A 62% 82%,#E5532B 82%)}
[hidden]{display:none!important}

/* ---------- Tela de entrada ---------- */
#login{min-height:100dvh;display:flex;flex-direction:column;background:
  radial-gradient(900px 500px at 15% -10%,rgba(20,104,216,.16),transparent 60%),
  radial-gradient(700px 420px at 100% 110%,rgba(252,188,2,.16),transparent 60%),var(--bg)}
#login main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;gap:28px}
.plate{background:#fff;border-radius:20px;padding:18px 26px;box-shadow:0 1px 0 rgba(16,35,63,.06),0 18px 50px -20px rgba(11,42,91,.35);display:inline-flex}
.plate img{display:block;width:min(400px,68vw);height:auto}
.panel{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 24px 60px -30px rgba(11,42,91,.45)}
.panel h1{margin:0 0 4px;font-size:1.45rem;font-weight:800;letter-spacing:-.01em;color:var(--navy)}
:root[data-theme="dark"] .panel h1{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .panel h1{color:var(--ink)}}
.panel p{margin:0 0 20px;color:var(--muted);font-size:.95rem}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:8px}
.field{display:flex;gap:10px;flex-wrap:wrap}
.field input{flex:1 1 200px;min-width:0;height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 16px;font-size:1.2rem;font-weight:600;letter-spacing:.04em}
.field input::placeholder{color:#8A9AB3;font-weight:500;letter-spacing:.04em}
.field input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 4px rgba(20,104,216,.18)}
.btn{height:54px;padding:0 26px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;transition:background .15s,transform .1s}
.btn:hover{background:#0F57B8}.btn:active{transform:translateY(1px)}
:root[data-theme="dark"] .btn{color:#06142B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#06142B}}
.err{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--red-soft);color:#B63A17;font-size:.92rem;font-weight:500}
:root[data-theme="dark"] .err{color:#FFB199}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#FFB199}}
footer.f{padding:18px 20px;text-align:center;color:var(--muted);font-size:.82rem}

/* ---------- Resultados ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.top .plate{padding:6px 12px;border-radius:12px;box-shadow:none;border:1px solid var(--line)}
.top .plate img{width:120px}
.top .ttl{flex:1;min-width:0;font-weight:700;line-height:1.2}
.top .ttl small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
.ghost{height:42px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-weight:600;cursor:pointer}
.ghost:hover{border-color:var(--blue);color:var(--blue)}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 56px}
.hello h2{margin:0;font-size:clamp(1.5rem,3.6vw,2.1rem);font-weight:800;letter-spacing:-.02em;color:var(--navy)}
:root[data-theme="dark"] .hello h2{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hello h2{color:var(--ink)}}
.hello p{margin:6px 0 0;color:var(--muted)}
.sum{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 26px}
.sum span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.88rem;font-weight:600}
.sum b{color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.school{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:16px;padding:20px;transition:box-shadow .2s,border-color .2s}
.school:hover{box-shadow:0 14px 34px -18px rgba(11,42,91,.5);border-color:var(--blue)}
.school:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.school.es{border-left-color:var(--green)} .school.es:hover{border-color:var(--green)}
.school h3{margin:0;font-size:1.05rem;font-weight:800;line-height:1.3;color:var(--navy)}
:root[data-theme="dark"] .school h3{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .school h3{color:var(--ink)}}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;background:var(--blue-soft);color:var(--blue);font-size:.8rem;font-weight:700}
.chip.g{background:var(--green-soft);color:var(--green)}
.chip.y{background:var(--yellow-soft);color:#8A6500}
.chip.r{background:var(--red-soft);color:#B63A17}
:root[data-theme="dark"] .chip.y{color:#FCD34D}:root[data-theme="dark"] .chip.r{color:#FFB199}:root[data-theme="dark"] .chip.g{color:#8FD58C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.y{color:#FCD34D}:root:not([data-theme="light"]) .chip.r{color:#FFB199}:root:not([data-theme="light"]) .chip.g{color:#8FD58C}}
.school .go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--blue);font-weight:700;font-size:.9rem}
.school.es .go{color:var(--green)}

/* ---------- Detalhe da escola ---------- */
.back{margin-bottom:18px}
.dh{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;border-top:6px solid var(--blue);margin-bottom:26px}
.dh.es{border-top-color:var(--green)}
.dh h2{margin:0 0 10px;font-size:clamp(1.3rem,3vw,1.8rem);font-weight:800;letter-spacing:-.01em;color:var(--navy)}
:root[data-theme="dark"] .dh h2{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dh h2{color:var(--ink)}}
.day{margin:0 0 28px}
.day h3{margin:0 0 12px;font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.day h3 .dot{width:12px;height:12px;border-radius:50%;background:var(--yellow)}
.day h3 small{font-weight:500;color:var(--muted);font-size:.85rem}
.turmas{display:grid;gap:12px}
.turma{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.turma .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.turma .nm{font-size:1.2rem;font-weight:800;min-width:110px}
.turma .info{flex:1 1 240px;color:var(--muted);font-size:.92rem}
.turma .info b{color:var(--ink);font-weight:600}
.turma.x{border-color:#E2C766;background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box}
.alunos{margin:14px 0 0;padding:14px 16px;background:var(--yellow-soft);border-radius:10px}
.alunos h4{margin:0 0 8px;font-size:.9rem;font-weight:800}
.alunos ul{margin:0;padding-left:20px}.alunos li{padding:2px 0;font-weight:500}
.empty{padding:20px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  .enter{animation:in .35s ease both}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
@media (max-width:520px){.top .plate img{width:92px}.top .in{gap:10px;padding:8px 14px}.wrap{padding:22px 14px 48px}.panel{padding:22px}}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TIPO={R:'Turma regular',X:'Sala extra',E:'Rede Estadual'};
const cpf=$('#cpf');
cpf.addEventListener('input',()=>{
  let d=cpf.value.replace(/\D/g,'').slice(0,11);
  d=d.replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1-$2');
  cpf.value=d; $('#msg').innerHTML='';
});
cpf.addEventListener('keydown',e=>{if(e.key==='Enter')buscar()});
$('#buscar').addEventListener('click',buscar);
$('#nova').addEventListener('click',()=>{ $('#app').hidden=true; $('#login').hidden=false; cpf.value=''; cpf.focus(); window.scrollTo(0,0); });

function buscar(){
  const d=cpf.value.replace(/\D/g,'');
  const m=$('#msg');
  if(d.length!==11){ m.innerHTML='<div class="err">Digite os 11 números do CPF.</div>'; return; }
  const p=DATA[d];
  if(!p){ m.innerHTML='<div class="err">Não encontramos este CPF no cronograma do SAVEAL 2026. Confira os números ou procure a coordenação.</div>'; return; }
  $('#login').hidden=true; $('#app').hidden=false; window.scrollTo(0,0);
  lista(p);
}
function agrupar(p){
  const m=new Map();
  p.a.forEach(a=>{ if(!m.has(a.e)) m.set(a.e,[]); m.get(a.e).push(a); });
  return [...m.entries()].sort((x,y)=>x[0].localeCompare(y[0],'pt-BR'));
}
function lista(p){
  const esc_=agrupar(p);
  const datas=[...new Set(p.a.map(a=>a.dt))].sort();
  $('#view').innerHTML=`
  <div class="enter">
    <div class="hello"><h2>Olá, ${esc(p.n.split(' ')[0])}</h2><p>${esc(p.n)} · Selecione uma escola para ver suas turmas.</p></div>
    <div class="sum">
      <span><b>${esc_.length}</b> ${esc_.length>1?'escolas':'escola'}</span>
      <span><b>${p.a.length}</b> ${p.a.length>1?'aplicações':'aplicação'}</span>
      <span>Datas: <b>${datas.map(d=>d+'/2026').join(' e ')}</b></span>
    </div>
    <div class="grid">${esc_.map(([nome,t],i)=>{
      const est=t.every(a=>a.t==='E');
      const ds=[...new Set(t.map(a=>a.dt))].sort();
      const ex=t.filter(a=>a.t==='X').length;
      return `<button class="school ${est?'es':''}" data-i="${i}" type="button">
        <h3>${esc(nome)}</h3>
        <div class="meta">
          <span class="chip ${est?'g':''}">${t.length} ${t.length>1?'turmas':'turma'}</span>
          ${ds.map(d=>`<span class="chip y">${d}</span>`).join('')}
          ${est?'<span class="chip g">Rede Estadual</span>':''}
          ${ex?`<span class="chip r">${ex} sala${ex>1?'s':''} extra</span>`:''}
        </div>
        <div class="go"><span>Ver turmas</span><span aria-hidden="true">›</span></div>
      </button>`}).join('')}
    </div>
  </div>`;
  document.querySelectorAll('.school').forEach(b=>b.addEventListener('click',()=>detalhe(p,esc_[+b.dataset.i])));
}
function detalhe(p,[nome,t]){
  const est=t.every(a=>a.t==='E');
  const dias=[...new Set(t.map(a=>a.d))].sort();
  const ord=a=>(a.u==='Matutino'?0:1);
  const html=dias.map(d=>{
    const ts=t.filter(a=>a.d===d).sort((a,b)=>ord(a)-ord(b)||a.m.localeCompare(b.m,'pt-BR',{numeric:true}));
    return `<div class="day"><h3><span class="dot"></span>Dia ${d} <small>${ts[0].dt}/2026 · ${ts.length} ${ts.length>1?'turmas':'turma'}</small></h3>
    <div class="turmas">${ts.map(a=>`
      <article class="turma ${(a.t==='X'||a.al.length)?'x':''}">
        <div class="row">
          <div class="nm">${esc(a.m)}</div>
          <div class="info"><b>${esc(a.p)}</b><br>${esc(a.u)}${a.c?' · Aplicador '+esc(a.c):''}</div>
          <span class="chip ${a.t==='X'?'r':a.t==='E'?'g':''}">${TIPO[a.t]}</span>
        </div>
        ${(a.t==='X'||a.al.length||/extra/i.test(a.m))?`<div class="alunos"><h4>${a.al.length>1?'Alunos desta sala ('+a.al.length+')':'Aluno desta sala'}</h4>${a.al.length?`<ul>${a.al.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:'<div class="empty">A lista de alunos desta sala não consta na planilha. Procure a coordenação.</div>'}</div>`:''}
      </article>`).join('')}</div></div>`;
  }).join('');
  $('#view').innerHTML=`<div class="enter">
    <button class="ghost back" id="voltar" type="button">‹ Voltar às escolas</button>
    <div class="dh ${est?'es':''}"><h2>${esc(nome)}</h2>
      <div class="meta"><span class="chip ${est?'g':''}">${t.length} ${t.length>1?'turmas':'turma'}</span>${[...new Set(t.map(a=>a.dt))].sort().map(d=>`<span class="chip y">${d}/2026</span>`).join('')}</div>
    </div>${html}</div>`;
  $('#voltar').addEventListener('click',()=>{lista(p);window.scrollTo(0,0)});
  window.scrollTo(0,0);
}
</script>
